name: queryquill

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: queryquill_pgvector
    environment:
      POSTGRES_DB: queryquilldb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d queryquilldb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queryquill_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres-vector;Port=5432;Database=queryquilldb;Username=user;Password=password
    ports:
      - "8080:8080"
    depends_on:
      postgres-vector:
        condition: service_healthy
    restart: on-failure

volumes:
  pgvector_data: