name: queryquill

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: queryquill_pgvector
    environment:
      POSTGRES_DB: queryquilldb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d queryquilldb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data: